name: Level 2 fixture validation

on:
  push:
    branches:
      - gemverse
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-level2-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate deterministic fixture contract
        run: python fixtures/level2/validate_fixture.py
